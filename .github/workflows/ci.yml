name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Prisma schema validation
        run: npx prisma validate

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Dummy, well-formed values so build-time env validation
          # (src/lib/env.ts) passes — this job never contacts a real
          # database or Supabase project, it only proves the app compiles.
          NODE_ENV: production
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
          SERVICE_DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

      - name: Dependency audit (informational)
        # Non-blocking: current high-severity findings are transitive dev
        # deps bundled inside Next.js itself (postcss, sharp) with no fix
        # available short of downgrading Next to an old major version.
        # Surfaced here for visibility, not treated as a merge gate.
        run: npm audit --audit-level=high || true

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: checks
    # Requires real Supabase dev-project secrets (DATABASE_URL, DIRECT_URL,
    # SERVICE_DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL,
    # NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY) configured
    # as repo secrets — the smoke test boots a real production build against
    # a real (non-production) Supabase project. Until those secrets exist
    # this job fails fast with a clear env-validation error rather than
    # silently skipping.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e
        env:
          CI: true
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SERVICE_DATABASE_URL: ${{ secrets.SERVICE_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
